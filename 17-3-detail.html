<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --primary: #2563eb;
            --secondary: #7c3aed;
            --shadow: rgba(15, 23, 42, 0.08);
            --accent: #eff6ff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
            color: var(--text);
        }

        .zhang_container {
            width: min(1000px, calc(100% - 30px));
            margin: 32px auto;
        }

        .zhang_topbar {
            margin-bottom: 20px;
        }

        .zhang_back_btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .zhang_detail_card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 35px var(--shadow);
        }

        .zhang_detail_head {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            min-height: 420px;
        }

        .zhang_img_box {
            background: #f1f5f9;
        }

        .zhang_img_box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .zhang_info {
            padding: 26px 24px;
        }

        .zhang_badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--primary);
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(28px, 4vw, 38px);
            line-height: 1.3;
        }

        .zhang_subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.8;
            font-size: 16px;
        }

        .zhang_stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .zhang_stat {
            padding: 10px 14px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--muted);
        }

        .zhang_price {
            font-size: clamp(30px, 4vw, 42px);
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 18px;
        }

        .zhang_detail_btn {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: 700;
        }

        .zhang_empty {
            background: var(--card);
            border: 1px dashed var(--border);
            border-radius: 18px;
            padding: 42px 20px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .zhang_detail_head {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="zhang_container">
        <div class="zhang_topbar">
            <a class="zhang_back_btn" href="17-3.html">← 返回商品列表</a>
        </div>
        <div id="zhang_detail" class="zhang_detail_card"></div>
    </div>

    <script>
        const zhang_detailBox = document.getElementById("zhang_detail");
        const zhang_params = new URLSearchParams(window.location.search);
        const zhang_productId = zhang_params.get("id") || 1;

        async function loadProduct() {
            try {
                const response = await fetch(`https://dummyjson.com/products/${zhang_productId}`);
                if (!response.ok) {
                    throw new Error(`请求失败：${response.status}`);
                }

                const product = await response.json();
                zhang_detailBox.innerHTML = `
                    <div class="zhang_detail_head">
                        <div class="zhang_img_box">
                            <img src="${product.thumbnail || product.images?.[0] || "https://via.placeholder.com/800x600?text=Product"}" alt="${product.title}">
                        </div>
                        <div class="zhang_info">
                            <span class="zhang_badge">${product.category}</span>
                            <h1>${product.title}</h1>
                            <p class="zhang_subtitle">${product.description}</p>
                            <div class="zhang_stats">
                                <span class="zhang_stat">品牌：${product.brand}</span>
                                <span class="zhang_stat">库存：${product.stock}</span>
                                <span class="zhang_stat">评分：${product.rating}</span>
                            </div>
                            <div class="zhang_price">￥${product.price}</div>
                            <a class="zhang_detail_btn" href="17-3.html">查看全部商品</a>
                        </div>
                    </div>
                `;
            } catch (error) {
                zhang_detailBox.innerHTML = '<div class="zhang_empty">商品详情加载失败，请返回列表页重新查看。</div>';
            }
        }

        loadProduct();
    </script>
</body>
</html>
