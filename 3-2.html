<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>312 张轩铭</title>
    <style>
        
            h3{
                color: red;
            }
            p{
                color: blue;
            }
            /* 标签选择器，选择器名称为标签 */
            #box{
                width:500px;
                height:500px;
                background-color:#ccc;
            }
            /* id选择器，以#开始，唯一 */
            .z{
                color: #7a9;
            }
            .x {
            color: green;
        }
            .m {
            color: orange;
            }
            /* class选择器，以.开始，可以重复使用 */
            h2 {
            background-color: black;
            color: white;
        }
        .white-text {
            color: white;
        }
         .new-box {
            width: 220px;
            height: 120px;
            background-color: #66ccff;
            margin-top: 20px;
            line-height: 120px;
            text-align: center;
        }

        </style>
</head>
<body>
    <h2>层叠样式表css</h2>
    <div id="box">
        <h3>CSS<span class="white-text">选择器</span></h3>
        <p><span class = "z">张</span><span class="x">轩</span><span class="m">铭</span></p>
        <p>CSS属性</p>
        
    </div>
     <div class="new-box">24001010312</div>
    <!-- 扩展h2黑底白字
     名字每个字不同颜色在同一行
     选择器这三个字是白色
     新加一个盒子，盒子里的文字是312 -->
</body>
</html>
