<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询 · 响应式全屏盒子</title>
    <style>
        /* rem 基准：根元素字体大小随视口变化 */
        html {
            /* 默认（大屏 ≥1200px）：1rem = 20px */
            font-size: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.6s ease;
        }

        /* 全屏盒子 */
        .box {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.6s ease;
        }

        .box h1 {
            color: #fff;
            font-size: 3rem;
            letter-spacing: 0.5rem;
            text-shadow: 0 0.2rem 0.4rem rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }

        .box p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.2rem;
            letter-spacing: 0.15rem;
        }

        /* 当前视口宽度提示 */
        .info {
            position: fixed;
            top: 1rem;
            right: 1rem;
            color: #fff;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
        }

        /* ===================== 媒体查询 ===================== */

        /* 超大屏 ≥1400px —— 深蓝 */
        @media (min-width: 1400px) {
            html { font-size: 22px; }
            .box { background-color: #1a3a5c; }
        }

        /* 大屏 1200px ~ 1399px —— 靛蓝 */
        @media (min-width: 1200px) and (max-width: 1399px) {
            html { font-size: 20px; }
            .box { background-color: #2c5f8a; }
        }

        /* 中屏 992px ~ 1199px —— 青绿 */
        @media (min-width: 992px) and (max-width: 1199px) {
            html { font-size: 18px; }
            .box { background-color: #0d9488; }
        }

        /* 小屏 768px ~ 991px —— 翠绿 */
        @media (min-width: 768px) and (max-width: 991px) {
            html { font-size: 16px; }
            .box { background-color: #4caf50; }
        }

        /* 超小屏 576px ~ 767px —— 橙色 */
        @media (min-width: 576px) and (max-width: 767px) {
            html { font-size: 14px; }
            .box { background-color: #f57c00; }
        }

        /* 移动端 <576px —— 红色 */
        @media (max-width: 575px) {
            html { font-size: 12px; }
            .box { background-color: #d32f2f; }
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>张轩铭</h1>
        <p>拖动浏览器窗口大小，背景颜色与文字大小会随视口变化</p>
    </div>
    <div class="info">视口宽度：<span id="w">--</span> px</div>

    <script>
        // 实时显示当前视口宽度
        function updateWidth() {
            document.getElementById('w').textContent = window.innerWidth;
        }
        updateWidth();
        window.addEventListener('resize', updateWidth);
    </script>
</body>
</html>
