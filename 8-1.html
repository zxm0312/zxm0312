<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display:flex;
            flex-wrap:wrap;
            margin:10px;
        }
        .box{
            width:150px;
            height:150px;
            margin:10px;
            border-radius: 10px;
            border:1px solid #ccc;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            transition: all 0.6s;
            box-sizing: border-box;
        }
        .box:first-child:hover{
            background-color: #f00;
            color:#fff;
            fonst-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 5px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 5px 5px 5px #ccc;
        }
        .box:nth-of-type(5):hover{
            background-image: linear-gradient(to right,#f00,#0f0,#00f);
        }
        .box:nth-of-type(5)+.box{
            background-image: radial-gradient(circle,#fff,#ccc,#000);}
    </style>
</head>
<body>
    <div class = "main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
