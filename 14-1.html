<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数 7 游戏 · 张轩铭</title>
    <style>
        :root {
            --zhang_primary: #2f6fed;
            --zhang_secondary: #6e56cf;
            --zhang_accent: #f59e0b;
            --zhang_bg: #f4f7ff;
            --zhang_surface: #ffffff;
            --zhang_ink: #17233c;
            --zhang_muted: #69758d;
            --zhang_radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            background:
                radial-gradient(circle at 12% 10%, #dce9ff 0, transparent 30%),
                radial-gradient(circle at 88% 14%, #e6ddff 0, transparent 28%),
                linear-gradient(135deg, #f7faff, #eef2fb);
            color: var(--zhang_ink);
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .zhang_wrap { width: min(1000px, 100%); margin: 0 auto; }

        h1 {
            text-align: center;
            font-size: clamp(26px, 5vw, 42px);
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .zhang_sub {
            text-align: center;
            color: var(--zhang_muted);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .zhang_rule {
            display: block;
            text-align: center;
            margin-bottom: 30px;
        }

        .zhang_rule code {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            background: rgba(47, 111, 237, 0.1);
            color: var(--zhang_primary);
        }

        .zhang_section {
            background: var(--zhang_surface);
            border-radius: var(--zhang_radius);
            padding: 28px;
            box-shadow: 0 10px 28px rgba(23, 35, 60, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .zhang_board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
        }

        .zhang_box {
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
            border-radius: 10px;
            font-size: clamp(14px, 2.2vw, 22px);
            font-weight: 700;
            color: var(--zhang_primary);
            background: linear-gradient(145deg, #ffffff, #f0f5ff);
            border: 1px solid #d8e3fb;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .zhang_box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(47, 111, 237, 0.18);
        }

        /* 满足数 7 规则的盒子 → 空盒子 */
        .zhang_box.is-pass {
            background: linear-gradient(145deg, #fff7e6, #ffe8c2);
            border-color: #f5c87a;
            color: transparent; /* 隐藏内部数字，呈现空盒子 */
        }

        .zhang_footer {
            margin-top: 30px;
            text-align: center;
            color: var(--zhang_muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="zhang_wrap">
        <h1>数 7 游戏</h1>
        <p class="zhang_sub">输出 1 ~ 100 共 100 个盒子，遇到 <b>7 的倍数</b> 或 <b>末尾是 7</b> 的数，输出空盒子</p>
        <span class="zhang_rule"><code>规则：n % 7 === 0 || n % 10 === 7</code></span>

        <section class="zhang_section">
            <div class="zhang_board" id="board"></div>
        </section>

        <footer class="zhang_footer">312 张轩铭 · 数 7 游戏</footer>
    </div>

    <script>
        (function () {
            var board = document.getElementById('board');
            var html = '';
            for (var n = 1; n <= 100; n++) {
                var isPass = (n % 7 === 0 || n % 10 === 7);
                if (isPass) {
                    html += '<div class="zhang_box is-pass"></div>';
                } else {
                    html += '<div class="zhang_box">' + n + '</div>';
                }
            }
            board.innerHTML = html;
        })();
    </script>
</body>
</html>
