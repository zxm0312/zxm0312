<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>312 张轩铭</title>
</head>
<body>
    <h2>HTML元素：开始标签+内容+结束标签</h2>
    <h3>内容与样式分离-语义性</h3>
        <h4>山居秋暝</h4>
        空山新雨后，<br>
        天<br>
        <p>明</p>
        <p>清</p>
        <h4>93阅兵展示的武器列表</h4>
        <ul>
            <li>东风</li>
            <li>鹰击</li>
            <li>长缨</li>
            <li>巨浪</li>
            <li>霹雳</li>
        </ul>
        <!-- 区域，块 -->
        <div style="background-color: #12abcd;width: 400px;height: 200px;">
            盒子
            <!-- 块级元素 -->
            <div>
                <!-- 行间元素 -->
                <span style="color: #d3f802;font-size: 50px;">张</span>
                <span style="color: #97b200;font-size: 50px;">轩</span>
                <span style="color: #697b00;font-size: 50px;">铭</span>
                <!-- 扩展：名字的每个字不同颜色在同一行 -->
            </div>
        </div>


</body>
</html>
