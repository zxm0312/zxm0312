<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品列表</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --shadow: rgba(15, 23, 42, 0.08);
            --tag: #f3e8ff;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #f5f3ff 0%, #f8fafc 100%);
            color: var(--text);
        }

        .zhang_container {
            width: min(1200px, calc(100% - 30px));
            margin: 30px auto;
        }

        .zhang_header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 42px);
        }

        .zhang_status {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .zhang_products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .zhang_product_card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 25px var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .zhang_product_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px rgba(91, 33, 182, 0.12);
        }

        .zhang_product_card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: #f1f5f9;
        }

        .zhang_content {
            padding: 16px;
        }

        .zhang_tag {
            display: inline-block;
            margin-bottom: 10px;
            background: var(--tag);
            color: var(--primary-dark);
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .zhang_title {
            font-size: 20px;
            margin: 0 0 10px;
            line-height: 1.4;
        }

        .zhang_desc {
            margin: 0 0 12px;
            color: var(--muted);
            line-height: 1.7;
            min-height: 80px;
        }

        .zhang_meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .zhang_price {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .zhang_rating {
            color: #f59e0b;
            font-weight: 700;
        }

        .zhang_detail_btn {
            width: 100%;
            border: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            padding: 12px 14px;
            font: inherit;
            cursor: pointer;
        }

        .zhang_empty {
            padding: 36px 20px;
            text-align: center;
            background: var(--card);
            border: 1px dashed var(--border);
            border-radius: 16px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="zhang_container">
        <div class="zhang_header">
            <h1>17-3 · 商品列表</h1>
        </div>
        <div id="zhang_status" class="zhang_status">正在获取商品数据...</div>
        <div id="zhang_products" class="zhang_products"></div>
    </div>

    <script>
        const zhang_apiUrl = "https://dummyjson.com/products?limit=8";
        const zhang_statusBox = document.getElementById("zhang_status");
        const zhang_productsBox = document.getElementById("zhang_products");

        async function loadProducts() {
            zhang_statusBox.textContent = "正在获取商品数据...";
            zhang_productsBox.innerHTML = "";

            try {
                const response = await fetch(zhang_apiUrl);
                if (!response.ok) {
                    throw new Error(`请求失败：${response.status}`);
                }

                const data = await response.json();
                const products = data.products || [];

                if (!products.length) {
                    zhang_productsBox.innerHTML = '<div class="zhang_empty">暂无商品数据。</div>';
                    zhang_statusBox.textContent = "当前没有商品数据。";
                    return;
                }

                zhang_productsBox.innerHTML = products.map(product => `
                    <article class="zhang_product_card">
                        <img src="${product.thumbnail || product.images?.[0] || "https://via.placeholder.com/400x240?text=Product"}" alt="${product.title}">
                        <div class="zhang_content">
                            <span class="zhang_tag">${product.category}</span>
                            <h2 class="zhang_title">${product.title}</h2>
                            <p class="zhang_desc">${product.description}</p>
                            <div class="zhang_meta">
                                <div class="zhang_price">￥${product.price}</div>
                                <div class="zhang_rating">★ ${product.rating}</div>
                            </div>
                            <button class="zhang_detail_btn" type="button" data-id="${product.id}">查看详情</button>
                        </div>
                    </article>
                `).join("");

                document.querySelectorAll(".zhang_detail_btn").forEach(button => {
                    button.addEventListener("click", function () {
                        const id = this.dataset.id;
                        window.location.href = `17-3-detail.html?id=${id}`;
                    });
                });

                zhang_statusBox.textContent = `已获取 ${products.length} 个商品。`;
            } catch (error) {
                zhang_statusBox.textContent = `获取失败：${error.message}`;
                zhang_productsBox.innerHTML = '<div class="zhang_empty">数据加载失败，请稍后再试。</div>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
