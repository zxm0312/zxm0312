<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询 · 八盒子响应式布局</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 36px 16px;
            color: #193449;
            background: #f1f5f3;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        .page {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            color: #617481;
            font-size: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .box {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-radius: 8px;
            color: #fff;
            background: #167d8d;
        }

        .box:nth-child(2) { background: #d87942; }
        .box:nth-child(3) { background: #466da8; }
        .box:nth-child(4) { background: #54845e; }
        .box:nth-child(5) { background: #b25261; }
        .box:nth-child(6) { background: #6875a0; }
        .box:nth-child(7) { background: #99713c; }
        .box:nth-child(8) { background: #347c71; }

        .box span {
            font-size: 13px;
            opacity: 0.85;
        }

        .box h2 {
            margin: 0;
            font-size: 22px;
        }

        @media (min-width: 560px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 800px) {
            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (min-width: 1100px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header>
            <h1>张轩铭</h1>
            <p>调整浏览器视口宽度，查看每行盒子数量变化</p>
        </header>
        <section class="grid" aria-label="八个响应式盒子">
            <article class="box"><span>盒子 01</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 02</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 03</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 04</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 05</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 06</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 07</span><h2>张轩铭</h2></article>
            <article class="box"><span>盒子 08</span><h2>张轩铭</h2></article>
        </section>
    </main>
</body>
</html>
